# detekt overlay. buildUponDefaultConfig = true is set in the root
# build script, so this file records only the deviations from detekt's
# defaults.

build:
  weights:
    # TODO and FIXME comments are reported without failing the build.
    ForbiddenComment: 0

complexity:
  ComplexCondition:
    # Multi-condition guards are `&&` chains, as in the serializers'
    # structural `canDecode` checks.
    threshold: 12
  CyclomaticComplexMethod:
    threshold: 20
    # `when` entries without braces are not counted.
    ignoreSimpleWhenEntries: true
    # Nested `let`, `apply`, `forEach`, and similar calls are not
    # counted.
    ignoreNestingFunctions: true
  LargeClass:
    threshold: 250
  LongMethod:
    threshold: 100
  LongParameterList:
    # Data-class constructors are exempt in practice; functions take
    # at most five parameters.
    constructorThreshold: 20
    functionThreshold: 6
    # Parameters with default values are not counted.
    ignoreDefaultParameters: true
  TooManyFunctions:
    # Type size is governed by body length (LargeClass), not by
    # function count.
    active: false

exceptions:
  TooGenericExceptionCaught:
    # The domain error currency is a type named `Exception`, so
    # catching it is idiomatic here.
    active: false
  TooGenericExceptionThrown:
    # As above: `Exception` is the app's structured error type.
    active: false

naming:
  ClassNaming:
    # Type names are at most 40 characters.
    classPattern: '[A-Z][a-zA-Z0-9]{0,39}'
  FunctionMaxLength:
    # Identifiers are at most 40 characters. Tests are exempt because
    # their names are backticked sentences.
    active: true
    maximumFunctionNameLength: 40
    excludes: ['**/test/**', '**/androidTest/**']
  FunctionNaming:
    # Composable functions are named in PascalCase.
    ignoreAnnotated: ['Composable']
  MatchingDeclarationName:
    # Per-consumer constants files are named AppConstants+(Consumer).kt,
    # so a single top-level (Consumer)Floats object need not match its
    # file name.
    active: false
  VariableMaxLength:
    # Identifiers are at most 40 characters.
    active: true
    maximumVariableNameLength: 40

# The project's own rules, defined in the :detekt-rules module.
panther:
  active: true
  FileLength:
    # Files are at most 400 lines, comments included.
    active: true
    threshold: 400
  MultilineParameters:
    # A declaration either lists every parameter on one line or puts
    # each parameter on its own line.
    active: true
    maxSingleLineParameters: 1

style:
  MagicNumber:
    # Design-token property declarations (e.g. Color(0xFF...)) read fine inline.
    ignorePropertyDeclaration: true
  MaxLineLength:
    # Lines are at most 160 characters, with comments exempt.
    maxLineLength: 160
    excludeCommentStatements: true
  ReturnCount:
    # Guard-style early returns (`?: return`) are used throughout, as
    # in the structural `canDecode` validators.
    active: false
  ThrowsCount:
    # Guarded operations throw early.
    active: false
